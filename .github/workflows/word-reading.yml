name: 单词阅读生成
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 生成阅读材料
        env:
          MAIMEMO_TOKEN: ${{ secrets.MAIMEMO_TOKEN }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          WEBHOOK_KEY: ${{ secrets.WEBHOOK_KEY }}
        run: |
          set -e

          echo "=== 获取今日单词 ==="
          PROGRESS=$(curl -s -X POST "https://open.maimemo.com/open/api/v1/memo/study/get_study_progress" \
            -H "Authorization: Bearer $MAIMEMO_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{}')
          FINISHED=$(echo "$PROGRESS" | jq -r '.data.progress.finished')
          TOTAL=$(echo "$PROGRESS" | jq -r '.data.progress.total')
          echo "进度: $FINISHED/$TOTAL"

          if [ "$TOTAL" = "0" ] || [ "$FINISHED" = "0" ]; then
            CONTENT="📚 今日墨墨提醒\n\n今天还没有背单词哦～\n背完单词后明天自动生成阅读材料。"
            ESCAPED=$(printf '%b' "$CONTENT" | jq -Rs '.')
            curl -s -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=$WEBHOOK_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"msgtype\":\"text\",\"text\":{\"content\":$ESCAPED}}"
            exit 0
          fi

          WORDS_RESP=$(curl -s -X POST "https://open.maimemo.com/open/api/v1/memo/study/get_today_items" \
            -H "Authorization: Bearer $MAIMEMO_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"limit": 200}')
          WORDS=$(echo "$WORDS_RESP" | jq -r '.data.today_items[].voc_spelling' | tr '\n' ',' | sed 's/,$//')
          WORD_COUNT=$(echo "$WORDS_RESP" | jq '.data.today_items | length')
          echo "单词数: $WORD_COUNT"

          echo "=== 调用智谱AI生成 ==="
          PROMPT_TEXT="根据以下英语单词，写一篇120词左右的英文小短文，自然包含所有单词并用*加粗标出。文末附2道选择题和答案。最后列出单词中文释义。直接输出，不要多余解释。单词：$WORDS"

          REQUEST_BODY=$(jq -n --arg p "$PROMPT_TEXT" '{
            model: "glm-4-flash",
            messages: [{role: "user", content: $p}],
            max_tokens: 1200
          }')

          AI_RESP=$(curl -s -X POST "https://open.bigmodel.cn/api/paas/v4/chat/completions" \
            -H "Authorization: Bearer $ZHIPU_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_BODY")

          AI_CONTENT=$(echo "$AI_RESP" | jq -r '.choices[0].message.content')
          echo "AI生成完成"

          CONTENT="📖 今日单词阅读（$WORD_COUNT个）\n\n$AI_CONTENT"

          echo "=== 发送企业微信 ==="
          ESCAPED=$(printf '%b' "$CONTENT" | jq -Rs '.')
          SEND_RESP=$(curl -s -X POST "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=$WEBHOOK_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"msgtype\":\"text\",\"text\":{\"content\":$ESCAPED}}")
          echo "发送结果: $SEND_RESP"
